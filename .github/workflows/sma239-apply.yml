name: Apply SMA-239 integration

on:
  push:
    branches:
      - agent/sma-239-literal-boundary
    paths:
      - .github/workflows/sma239-apply.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/sma-239-literal-boundary

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wire literal boundary into core and adapter
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              "src/core/provider.ts",
              "import { HarnessProfile, SemanticPolicyProfile, TextRange } from './model';\n",
              "import type { OffsetRange } from './changes';\nimport { HarnessProfile, SemanticPolicyProfile, TextRange } from './model';\n",
          )
          replace(
              "src/core/provider.ts",
              "export interface ProjectionProvider {\n    readonly id: string;\n    project(request: ProjectionRequest): Promise<ProjectionResult>;\n}\n",
              "export interface ProjectionProvider {\n    readonly id: string;\n    /** Optional provider-side boundary hook that may widen source ownership before slicing context. */\n    stabilizeSourceFocus?(\n        text: string,\n        focus: OffsetRange,\n        sourceLanguage: string,\n        targetLanguage: string,\n    ): OffsetRange;\n    project(request: ProjectionRequest): Promise<ProjectionResult>;\n}\n",
          )
          replace(
              "src/core/session.ts",
              "        const focusOffsets = normalizeProjectionFocus(document.text, this.dirtyOffsets);\n        if (!focusOffsets) {\n            return undefined;\n        }\n\n        const capturedRevision = this.revision;\n",
              "        let focusOffsets = normalizeProjectionFocus(document.text, this.dirtyOffsets);\n        if (!focusOffsets) {\n            return undefined;\n        }\n        if (provider.stabilizeSourceFocus) {\n            focusOffsets = provider.stabilizeSourceFocus(\n                document.text,\n                focusOffsets,\n                this.options.sourceLanguage,\n                this.options.targetLanguage,\n            );\n            assertOffsetRangeWithinText(focusOffsets, document.text.length, false);\n            assertRepresentableOffset(document.text, focusOffsets.start);\n            assertRepresentableOffset(document.text, focusOffsets.end);\n        }\n\n        const capturedRevision = this.revision;\n",
          )
          replace(
              "src/core/index.ts",
              "export * from './model';\n",
              "export * from './model';\nexport * from './literalBoundary';\n",
          )
          replace(
              "src/extension.ts",
              "import { ScaffoldProjectionProvider } from './providers/ScaffoldProjectionProvider';\n",
              "import { LiteralBoundaryProjectionProvider } from './core/literalBoundary';\nimport { ScaffoldProjectionProvider } from './providers/ScaffoldProjectionProvider';\n",
          )
          replace(
              "src/extension.ts",
              "    const provider = new ScaffoldProjectionProvider();\n",
              "    const provider = new LiteralBoundaryProjectionProvider(new ScaffoldProjectionProvider());\n",
          )
          replace(
              "scripts/run-core-tests.js",
              "    run(process.execPath, [path.join(root, 'tests', 'session-buffer-smoke.js')]);\n",
              "    run(process.execPath, [path.join(root, 'tests', 'session-buffer-smoke.js')]);\n    run(process.execPath, [path.join(root, 'tests', 'literal-boundary-smoke.js')]);\n",
          )

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check-types

      - name: Enforce host-neutral core
        run: npm run check:host-neutral

      - name: Run core smoke suite
        run: npm run test:core

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/provider.ts src/core/session.ts src/core/index.ts src/extension.ts scripts/run-core-tests.js
          git commit -m "feat: enforce literal provider boundary"
          git push
